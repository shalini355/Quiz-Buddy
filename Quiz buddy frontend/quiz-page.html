<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Buddy - Live Quiz</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0d0118;
            --bg-card: rgba(26, 16, 44, 0.95);
            --accent-purple: #70037d;
            --accent-cyan: #00adb5;
            --accent-green: #28a745;
            --accent-red: #dc3545;
            --text-main: #ffffff;
            --text-muted: #d0c8dd;
            --border-subtle: rgba(255, 255, 255, 0.15);
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #4a0254 0%, #15001c 60%, #050008 100%);
            color: var(--text-main);
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: rgba(10, 2, 18, 0.9) !important;
            border-bottom: 1px solid var(--border-subtle);
            backdrop-filter: blur(8px);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffffff !important;
            display: flex;
            align-items: center;
        }

        .navbar-brand img {
            border-radius: 8px;
            margin-right: 10px;
        }

        .nav-link {
            color: #dcd6eb !important;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .nav-link:hover {
            color: #ffffff !important;
        }

        .user-pill {
            background: rgba(0, 173, 181, 0.15);
            border: 1px solid var(--accent-cyan);
            color: #00f0ff;
            font-size: 0.85rem;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
        }

        .quiz-container {
            max-width: 820px;
            margin: 30px auto;
            padding: 30px;
            background: var(--bg-card);
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-subtle);
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .topic-badge {
            background: rgba(112, 3, 125, 0.4);
            border: 1px solid #a824bb;
            color: #f7d2ff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: capitalize;
        }

        .timer-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-subtle);
            color: #ffda79;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 6px 16px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .progress {
            height: 10px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-bar {
            background: linear-gradient(90deg, #007bff, #00adb5);
            transition: width 0.4s ease;
        }

        .question-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 25px;
        }

        .question-number {
            font-size: 0.9rem;
            color: var(--accent-cyan);
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .question-title {
            font-size: 1.35rem;
            font-weight: 600;
            line-height: 1.5;
            color: #ffffff;
            margin-bottom: 0;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            padding: 16px 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 173, 181, 0.6);
            transform: translateX(4px);
        }

        .option-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border: 2px solid #8e85a0;
            border-radius: 50%;
            margin-right: 14px;
            outline: none;
            display: grid;
            place-content: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .option-item input[type="radio"]::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em var(--accent-cyan);
        }

        .option-item input[type="radio"]:checked::before {
            transform: scale(1);
        }

        .option-item input[type="radio"]:checked {
            border-color: var(--accent-cyan);
        }

        .option-item.selected {
            border-color: var(--accent-cyan);
            background: rgba(0, 173, 181, 0.12);
        }

        .option-item.correct {
            border-color: var(--accent-green) !important;
            background: rgba(40, 167, 69, 0.2) !important;
            color: #98ffb3;
        }

        .option-item.incorrect {
            border-color: var(--accent-red) !important;
            background: rgba(220, 53, 69, 0.2) !important;
            color: #ff98a2;
        }

        .option-label {
            margin: 0;
            cursor: pointer;
            font-size: 1.05rem;
            color: #ffffff;
            width: 100%;
        }

        .quiz-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .btn-custom {
            padding: 12px 28px;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.25s ease;
        }

        .btn-custom:focus-visible {
            outline: 3px solid #00f0ff;
            outline-offset: 2px;
        }

        .btn-next {
            background-color: #007bff;
            border: none;
            color: #ffffff;
        }

        .btn-next:hover:not(:disabled) {
            background-color: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .btn-quit {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ccc;
        }

        .btn-quit:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
        }

        .explanation-box {
            display: none;
            margin-top: 15px;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid var(--accent-cyan);
            border-radius: 4px;
            font-size: 0.95rem;
            color: #dceef2;
        }

        footer {
            margin-top: auto;
            background: rgba(10, 2, 18, 0.95);
            border-top: 1px solid var(--border-subtle);
            padding: 20px 0;
            color: #aaa;
            font-size: 0.9rem;
        }

        footer a {
            color: #00adb5;
            text-decoration: none;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        @media (max-width: 576px) {
            .quiz-container {
                padding: 20px 15px;
                margin: 15px 10px;
            }

            .question-title {
                font-size: 1.15rem;
            }

            .quiz-actions {
                flex-direction: column-reverse;
            }

            .quiz-actions .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .option-item, .progress-bar, .btn-custom {
                transition: none !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation Bar -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="Homepage.html">
                    <img src="Designer (3).png" width="36" height="36" alt="Quiz Buddy Logo">
                    QUIZ BUDDY
                </a>
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#quizNav"
                    aria-controls="quizNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="quizNav">
                    <ul class="navbar-nav mr-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="Homepage.html">Home</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Quizselection.html">Quizzes</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="dashboard3.html">Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="Aboutus.html">About</a>
                        </li>
                    </ul>
                    <div class="d-flex align-items-center">
                        <span id="userStatus" class="user-pill mr-2">
                            <i class="fas fa-user-circle mr-1"></i> Guest Coder
                        </span>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main Quiz Container -->
    <main class="container my-auto">
        <div class="quiz-container" id="quizContainer">
            <!-- Metadata Row -->
            <div class="quiz-meta">
                <div class="topic-badge" id="topicBadge">
                    <i class="fas fa-code mr-1"></i> Programming Quiz
                </div>
                <div class="timer-badge" id="timerBadge" role="timer" aria-live="polite">
                    <i class="fas fa-stopwatch"></i> <span id="timerDisplay">05:00</span>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                <div class="progress-bar" id="progressBar" style="width: 0%;"></div>
            </div>

            <!-- Question Card -->
            <div class="question-card">
                <div class="question-number" id="questionCounter">Loading Question...</div>
                <h2 class="question-title" id="questionText">Preparing your quiz questions...</h2>
            </div>

            <!-- Options -->
            <form id="optionsForm" class="options-list" onsubmit="event.preventDefault();">
                <!-- Dynamically populated options -->
            </form>

            <!-- Explanation Feedback -->
            <div class="explanation-box" id="explanationBox"></div>

            <!-- Action Buttons -->
            <div class="quiz-actions">
                <a href="Quizselection.html" class="btn btn-custom btn-quit" onclick="return confirmQuit()">
                    <i class="fas fa-arrow-left mr-1"></i> Quit Quiz
                </a>
                <button type="button" class="btn btn-custom btn-next" id="nextBtn" disabled>
                    Next Question <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center">
            <p class="mb-1">&copy; 2024–2026 Quiz Buddy. An educational frontend project.</p>
            <div>
                <a href="privacy.html" class="mr-3">Privacy Policy</a>
                <a href="terms.html" class="mr-3">Terms of Service</a>
                <a href="Contact-us-page.html">Contact Us</a>
            </div>
        </div>
    </footer>

    <!-- Bootstrap & jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <!-- Quiz Engine Script -->
    <script>
        // State variables
        let quizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedAnswers = [];
        let timerSeconds = 300; // 5 minutes
        let timerInterval = null;
        let hasAnsweredCurrent = false;

        // URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const selectedLanguage = (urlParams.get('language') || 'javascript').toLowerCase();
        const selectedDifficulty = (urlParams.get('difficulty') || 'beginner').toLowerCase();
        const selectedCategory = (urlParams.get('category') || 'syntax').toLowerCase();

        // Check user session / guest mode
        function initUserSession() {
            const rawUser = localStorage.getItem('quiz_user');
            const userStatusEl = document.getElementById('userStatus');
            if (rawUser) {
                try {
                    const user = JSON.parse(rawUser);
                    userStatusEl.innerHTML = `<i class="fas ${user.isGuest ? 'fa-user-clock' : 'fa-user-check'} mr-1"></i> ${user.name || 'User'}`;
                } catch(e) {
                    userStatusEl.innerHTML = `<i class="fas fa-user-clock mr-1"></i> Guest Coder`;
                }
            } else {
                userStatusEl.innerHTML = `<i class="fas fa-user-clock mr-1"></i> Guest Mode`;
            }
        }

        // Fetch questions from JSON
        async function loadQuizQuestions() {
            try {
                const response = await fetch('questions.json');
                if (!response.ok) throw new Error('Could not load questions.json');
                const allQuestions = await response.json();

                // Filter by language, then difficulty if possible
                let filtered = allQuestions.filter(q => q.language.toLowerCase() === selectedLanguage);
                
                // If category is specified, prioritize matching
                const categoryMatches = filtered.filter(q => q.category && q.category.toLowerCase() === selectedCategory);
                if (categoryMatches.length >= 3) {
                    filtered = categoryMatches;
                }

                // If difficulty filter matches
                const difficultyMatches = filtered.filter(q => q.difficulty && q.difficulty.toLowerCase() === selectedDifficulty);
                if (difficultyMatches.length >= 2) {
                    filtered = difficultyMatches;
                }

                // Fallback: If filtered list is small, supplement with same language
                if (filtered.length < 3) {
                    const generalMatches = allQuestions.filter(q => q.language.toLowerCase() === selectedLanguage);
                    filtered = generalMatches.length > 0 ? generalMatches : allQuestions.slice(0, 5);
                }

                quizQuestions = filtered.slice(0, 10); // Maximum 10 questions per quiz session
                startQuiz();
            } catch (err) {
                console.warn('Falling back to beginner-questions.json:', err);
                loadFallbackQuestions();
            }
        }

        // Fallback loader
        async function loadFallbackQuestions() {
            try {
                const res = await fetch('beginner-questions.json');
                const fallbackData = await res.json();
                quizQuestions = fallbackData.map((item, idx) => ({
                    id: 'fb-' + idx,
                    language: selectedLanguage,
                    difficulty: 'beginner',
                    category: 'General',
                    question: item.question,
                    choices: [item.choice1, item.choice2, item.choice3, item.choice4],
                    answer: item.answer,
                    explanation: `The correct answer is: ${item.answer}`
                }));
                startQuiz();
            } catch (e) {
                document.getElementById('questionText').innerText = 'Error loading questions. Please reload.';
            }
        }

        function startQuiz() {
            if (!quizQuestions || quizQuestions.length === 0) {
                document.getElementById('questionText').innerText = 'No questions available for this selection.';
                return;
            }

            // Update badge
            const prettyLang = selectedLanguage.charAt(0).toUpperCase() + selectedLanguage.slice(1);
            const prettyDiff = selectedDifficulty.charAt(0).toUpperCase() + selectedDifficulty.slice(1);
            document.getElementById('topicBadge').innerHTML = `<i class="fas fa-terminal mr-1"></i> ${prettyLang} • ${prettyDiff}`;

            currentIndex = 0;
            score = 0;
            selectedAnswers = [];
            startTimer();
            renderQuestion();
        }

        function startTimer() {
            const timerDisplay = document.getElementById('timerDisplay');
            timerInterval = setInterval(() => {
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerDisplay.innerText = "00:00";
                    alert('Time is up! Submitting your answers now.');
                    finishQuiz();
                } else {
                    timerSeconds--;
                    const m = Math.floor(timerSeconds / 60);
                    const s = timerSeconds % 60;
                    timerDisplay.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;
                }
            }, 1000);
        }

        function renderQuestion() {
            hasAnsweredCurrent = false;
            const currentQ = quizQuestions[currentIndex];
            const total = quizQuestions.length;

            // Update progress
            const percent = ((currentIndex) / total) * 100;
            const progressBar = document.getElementById('progressBar');
            progressBar.style.width = percent + '%';
            progressBar.setAttribute('aria-valuenow', percent);

            // Counter & title
            document.getElementById('questionCounter').innerText = `Question ${currentIndex + 1} of ${total}`;
            document.getElementById('questionText').innerText = currentQ.question;

            // Clear explanation box
            const explanationBox = document.getElementById('explanationBox');
            explanationBox.style.display = 'none';
            explanationBox.innerText = '';

            // Render options
            const optionsForm = document.getElementById('optionsForm');
            optionsForm.innerHTML = '';

            currentQ.choices.forEach((choice, index) => {
                const optionId = `opt_${currentIndex}_${index}`;
                const optionDiv = document.createElement('div');
                optionDiv.className = 'option-item';
                optionDiv.id = `item_${index}`;
                optionDiv.setAttribute('tabindex', '0');
                optionDiv.setAttribute('role', 'radio');
                optionDiv.setAttribute('aria-checked', 'false');

                optionDiv.innerHTML = `
                    <input type="radio" id="${optionId}" name="quizOption" value="${choice}" tabindex="-1">
                    <label class="option-label" for="${optionId}">${choice}</label>
                `;

                // Click handler
                optionDiv.addEventListener('click', () => selectOption(choice, index));

                // Keyboard accessibility
                optionDiv.addEventListener('keydown', (e) => {
                    if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                        selectOption(choice, index);
                    }
                });

                optionsForm.appendChild(optionDiv);
            });

            // Button label
            const nextBtn = document.getElementById('nextBtn');
            nextBtn.disabled = true;
            if (currentIndex === total - 1) {
                nextBtn.innerHTML = `Finish Quiz <i class="fas fa-check-circle ml-1"></i>`;
            } else {
                nextBtn.innerHTML = `Next Question <i class="fas fa-chevron-right ml-1"></i>`;
            }
        }

        function selectOption(choiceValue, choiceIndex) {
            if (hasAnsweredCurrent) return;

            // Highlight selected option
            const allItems = document.querySelectorAll('.option-item');
            allItems.forEach((item, idx) => {
                item.classList.remove('selected');
                item.setAttribute('aria-checked', 'false');
                const radio = item.querySelector('input[type="radio"]');
                if (radio) radio.checked = false;
            });

            const activeItem = document.getElementById(`item_${choiceIndex}`);
            if (activeItem) {
                activeItem.classList.add('selected');
                activeItem.setAttribute('aria-checked', 'true');
                const radio = activeItem.querySelector('input[type="radio"]');
                if (radio) radio.checked = true;
            }

            document.getElementById('nextBtn').disabled = false;
        }

        // Handle next button click
        document.getElementById('nextBtn').addEventListener('click', () => {
            const currentQ = quizQuestions[currentIndex];
            const checkedRadio = document.querySelector('input[name="quizOption"]:checked');
            if (!checkedRadio) return;

            const selectedChoice = checkedRadio.value;
            const correctAnswer = currentQ.answer;
            const isCorrect = selectedChoice.trim() === correctAnswer.trim();

            if (isCorrect) {
                score++;
            }

            // Save question result
            selectedAnswers.push({
                question: currentQ.question,
                selectedAnswer: selectedChoice,
                correctAnswer: correctAnswer,
                isCorrect: isCorrect,
                explanation: currentQ.explanation || 'Reference answer: ' + correctAnswer
            });

            // Instant feedback highlight
            hasAnsweredCurrent = true;
            document.querySelectorAll('.option-item').forEach(item => {
                const labelText = item.querySelector('.option-label').innerText.trim();
                if (labelText === correctAnswer.trim()) {
                    item.classList.add('correct');
                } else if (item.classList.contains('selected')) {
                    item.classList.add('incorrect');
                }
            });

            // Show explanation
            const explanationBox = document.getElementById('explanationBox');
            explanationBox.innerText = (isCorrect ? '✓ Correct! ' : '✗ Incorrect. ') + (currentQ.explanation || '');
            explanationBox.style.display = 'block';

            // Proceed after brief review
            setTimeout(() => {
                currentIndex++;
                if (currentIndex < quizQuestions.length) {
                    renderQuestion();
                } else {
                    finishQuiz();
                }
            }, 900);
        });

        function finishQuiz() {
            clearInterval(timerInterval);
            const total = quizQuestions.length;
            const scorePercent = Math.round((score / total) * 100);

            // Save to localStorage
            localStorage.setItem('mostRecentScore', scorePercent);
            localStorage.setItem('rawScore', `${score}/${total}`);
            localStorage.setItem('userAnswers', JSON.stringify(selectedAnswers));

            // Record into quiz history
            const quizSession = {
                id: 'quiz-' + Date.now(),
                title: `${selectedLanguage.toUpperCase()} ${selectedDifficulty} Quiz`,
                language: selectedLanguage,
                difficulty: selectedDifficulty,
                date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                score: `${scorePercent}%`,
                scoreRaw: `${score}/${total}`,
                totalQuestions: total,
                correctAnswers: score,
                wrongAnswers: total - score
            };

            let history = [];
            try {
                history = JSON.parse(localStorage.getItem('quiz_history')) || [];
            } catch(e) {
                history = [];
            }
            history.unshift(quizSession);
            localStorage.setItem('quiz_history', JSON.stringify(history));

            // Redirect to results page
            window.location.href = 'Resultpage.html';
        }

        function confirmQuit() {
            return confirm("Are you sure you want to quit this quiz? Your current progress will not be saved.");
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            initUserSession();
            loadQuizQuestions();
        });
    </script>
</body>

</html>
